<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praja Planner</title>
<style>
:root{--bg:#edf2f5;--card:#fff;--line:#d7e0e7;--text:#23303a;--muted:#687985;--green:#187e6a;--mint:#d8f1eb;--purple:#e6e2f6;--blue:#dfe8fb;--yellow:#fbf2c9;--pink:#f8dde1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}
header{background:#f8fafb;border-bottom:1px solid var(--line);padding:12px 18px;position:sticky;top:0;z-index:10}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{margin:0;font-size:25px}.subtitle{margin-top:5px;color:var(--muted);font-size:13px}.actions,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{max-width:1280px;margin:10px auto 0}.btn,.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:750;color:#33434d;cursor:pointer}.btn:hover,.tab:hover{background:#f3f7f8}.btn.primary,.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.live{display:flex;gap:7px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:750}.dot{width:8px;height:8px;border-radius:50%;background:#9aa7b0}.dot.on{background:#16a163}
.page{display:none;max-width:1280px;margin:0 auto;padding:14px}.page.active{display:block}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.toolbar h2{margin:0;font-size:18px}.toolbar-actions{display:flex;gap:7px;flex-wrap:wrap}
.week-block{margin-bottom:16px}.week-head{display:flex;justify-content:space-between;margin:0 0 8px;font-weight:800;color:#546b78}.week-head .range{font-size:13px}.week-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.day{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:180px;display:flex;flex-direction:column;overflow:hidden}.day.today{outline:2px solid var(--green);outline-offset:-2px}.day-head{background:#eef4f7;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;font-weight:800;font-size:14px}.date{color:#647985}.events{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}.event{border-radius:8px;padding:8px 9px;cursor:pointer;line-height:1.2}.event .time{font-size:11px;color:#566975;margin-bottom:3px;font-weight:750}.event .title{font-size:13px;font-weight:850}.event .place{font-size:11px;color:#657783;margin-top:4px}.cat-teaching{background:var(--yellow)}.cat-meeting{background:var(--purple)}.cat-research{background:var(--mint)}.cat-travel{background:var(--pink)}.cat-other{background:var(--blue)}.add-day{margin:6px;border:1px dashed #9fb4c0;background:#fff;border-radius:8px;padding:6px;text-align:center;color:#5d7180;font-weight:750;font-size:12px;cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.todo-date{padding:9px;border:1px solid var(--line);border-radius:9px}.todo-list,.note-list{display:flex;flex-direction:column;gap:8px}.todo-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:10px}.todo-row.done .todo-text{text-decoration:line-through;color:#87959d}.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:750}.empty{padding:30px;text-align:center;color:var(--muted)}
.notes-layout{display:grid;grid-template-columns:310px 1fr;gap:12px}.note-card{border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer}.note-card:hover{background:#f5f8f9}.note-card.active{border-color:var(--green);background:#eef8f5}.note-card strong{display:block}.note-card small{color:var(--muted)}.note-editor input,.note-editor textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px}.note-editor textarea{min-height:330px;resize:vertical;line-height:1.5}.note-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,28,34,.38);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:15px;width:min(540px,100%);box-shadow:0 20px 60px rgba(0,0,0,.2);padding:18px}.modal h2{margin:0 0 15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#60727e;display:block;margin-bottom:5px}.form-grid input,.form-grid select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.right-actions{display:flex;gap:8px}.danger{color:#b42318}.meeting-note{display:none}.meeting-note.show{display:block}
@media(max-width:900px){.top{align-items:flex-start;flex-direction:column}.week-grid{grid-template-columns:repeat(5,210px);overflow-x:auto}.notes-layout{grid-template-columns:1fr}.note-list{max-height:240px;overflow:auto}}@media(max-width:560px){.form-grid,.note-meta{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><h1>Praja Planner</h1><div class="subtitle" id="subtitle">Schedule · Korea Standard Time (KST)</div></div><div class="actions"><div class="live"><span id="dot" class="dot"></span><span id="syncText">Local</span></div><button class="btn" id="loginBtn">Google sign-in</button></div></div><nav class="tabs"><button class="tab active" data-page="schedule">Schedule</button><button class="tab" data-page="todo">Daily To-do</button><button class="tab" data-page="notes">Research Notes</button></nav></header>

<section class="page active" id="page-schedule"><div class="toolbar"><h2 id="showing">Two-week schedule</h2><div class="toolbar-actions"><button class="btn" id="prevBtn">Prev week</button><button class="btn" id="todayBtn">This week</button><button class="btn" id="nextBtn">Next week</button><button class="btn primary" id="addEventBtn">Add event</button></div></div><div class="legend"><span><i class="cat-teaching"></i>Teaching</span><span><i class="cat-meeting"></i>Meeting</span><span><i class="cat-research"></i>Research</span><span><i class="cat-travel"></i>Travel</span><span><i class="cat-other"></i>Other</span></div><main id="calendar"></main></section>

<section class="page" id="page-todo"><div class="toolbar"><h2>Daily To-do</h2><div class="toolbar-actions"><input class="todo-date" id="todoDate" type="date"><button class="btn primary" id="addTodoBtn">Add task</button></div></div><div class="panel"><div class="todo-list" id="todoList"></div></div></section>

<section class="page" id="page-notes"><div class="toolbar"><h2>Research Notes</h2><button class="btn primary" id="newNoteBtn">New note</button></div><div class="notes-layout"><div class="panel note-list" id="noteList"></div><div class="panel note-editor" id="noteEditor"><div class="empty">Select a note or create a new one.</div></div></div></section>

<div class="modal-backdrop" id="eventModal"><div class="modal"><h2 id="eventModalTitle">Add event</h2><div class="form-grid"><div class="full"><label>Title</label><input id="fTitle" placeholder="e.g. Project meeting"></div><div><label>Date</label><input id="fDate" type="date"></div><div><label>Category</label><select id="fCategory"><option value="teaching">Teaching</option><option value="meeting">Meeting</option><option value="research">Research</option><option value="travel">Travel</option><option value="other">Other</option></select></div><div><label>Start</label><input id="fStart" type="time"></div><div><label>End</label><input id="fEnd" type="time"></div><div class="full"><label>Location / short note</label><input id="fPlace" placeholder="Lab, online, room, etc."></div><div class="full meeting-note" id="meetingNoteOption"><label><input id="fCreateNote" type="checkbox" style="width:auto"> Create or open a research note for this meeting</label></div></div><div class="modal-actions"><button class="btn danger" id="deleteEventBtn" style="visibility:hidden">Delete</button><div class="right-actions"><button class="btn" data-close="eventModal">Cancel</button><button class="btn primary" id="saveEventBtn">Save</button></div></div></div></div>

<div class="modal-backdrop" id="todoModal"><div class="modal"><h2>Add task</h2><div class="form-grid"><div class="full"><label>Task</label><input id="fTodo" placeholder="What should be completed?"></div><div><label>Date</label><input id="fTodoDate" type="date"></div><div><label>Priority</label><select id="fPriority"><option>Normal</option><option>High</option><option>Low</option></select></div></div><div class="modal-actions"><span></span><div class="right-actions"><button class="btn" data-close="todoModal">Cancel</button><button class="btn primary" id="saveTodoBtn">Save</button></div></div></div></div>

<script type="module">
const semesterStart=new Date('2026-08-17T00:00:00+09:00');
const firebaseConfig={apiKey:'AIzaSyCzW9sHuRppwYoJ96UfM6a83J7Bpq0l-CU',authDomain:'praja-schedule.firebaseapp.com',projectId:'praja-schedule',storageBucket:'praja-schedule.firebasestorage.app',messagingSenderId:'67608230172',appId:'1:67608230172:web:94df5046a67d48d29922d9',measurementId:'G-834YH8LEHH'};
const courses=[{title:'Kartografi',day:1,start:'15:00',end:'16:45',place:'R. 308 · Class 1AB',weeks:[4,5,6,7,13,14,15]},{title:'Sistem Informasi Geospasial',day:1,start:'09:15',end:'11:00',place:'Hall · Class 3AB',weeks:[4,5,6,7,8,9,10]},{title:'Sistem Basisdata',day:3,start:'09:15',end:'11:00',place:'Hall · Class 3AB',weeks:[4,5,6,7,8,9,10]},{title:'Matematika',day:3,start:'11:05',end:'17:40',place:'R. 304 · Class 1AB',weeks:[11,12,13,14,15,16]}];
const $=id=>document.getElementById(id),key='prajaPlannerData';
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function seedEvents(){return courses.flatMap(c=>c.weeks.map(w=>{const d=new Date(semesterStart);d.setDate(d.getDate()+(w-1)*7+c.day-1);return{id:`seed-${c.title}-${w}`.replace(/\s+/g,'-'),title:c.title,date:iso(d),start:c.start,end:c.end,place:c.place,category:'teaching',seed:true}}))}
const old=JSON.parse(localStorage.getItem('prajaSimpleEvents')||'null');let data=JSON.parse(localStorage.getItem(key)||'null')||{events:Array.isArray(old)?old:seedEvents(),todos:[],notes:[]};data.events||=[];data.todos||=[];data.notes||=[];
let viewStart=startOfWeek(new Date()),editingEvent=null,activeNote=null,F=null,db=null,auth=null,unsub=null,syncing=false;
function startOfWeek(d){const x=new Date(d),n=x.getDay();x.setDate(x.getDate()+(n===0?-6:1-n));x.setHours(0,0,0,0);return x}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function uid(){return crypto.randomUUID()}
function persist(){localStorage.setItem(key,JSON.stringify(data));renderAll();pushCloud()}
function switchPage(name){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===`page-${name}`));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===name));$('subtitle').textContent=({schedule:'Schedule · Korea Standard Time (KST)',todo:'Daily tasks',notes:'Meeting and research records'})[name];if(name==='notes')renderNotes()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
function renderCalendar(){const cal=$('calendar');cal.innerHTML='';$('showing').textContent=`${iso(viewStart)} to ${iso(addDays(viewStart,13))}`;for(let w=0;w<2;w++){const ws=addDays(viewStart,w*7),we=addDays(ws,6),block=document.createElement('section');block.className='week-block';const sem=Math.floor((ws-semesterStart)/604800000)+1;block.innerHTML=`<div class="week-head"><span>Semester Week ${sem}</span><span class="range">${iso(ws)} - ${iso(we)}</span></div>`;const grid=document.createElement('div');grid.className='week-grid';for(let i=0;i<5;i++){const d=addDays(ws,i),date=iso(d),day=document.createElement('div');day.className='day'+(date===iso(new Date())?' today':'');day.innerHTML=`<div class="day-head"><span>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}</span><span class="date">${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}</span></div><div class="events"></div><div class="add-day">+ Add</div>`;const box=day.querySelector('.events');data.events.filter(e=>e.date===date).sort((a,b)=>(a.start||'99').localeCompare(b.start||'99')).forEach(e=>{const card=document.createElement('div');card.className=`event cat-${e.category||'other'}`;card.innerHTML=`${e.start?`<div class="time">${esc(e.start)}${e.end?' - '+esc(e.end):''}</div>`:''}<div class="title">${esc(e.title)}</div>${e.place?`<div class="place">${esc(e.place)}</div>`:''}`;card.onclick=()=>openEvent(e.id);box.appendChild(card)});day.querySelector('.add-day').onclick=()=>openEvent(null,date);grid.appendChild(day)}block.appendChild(grid);cal.appendChild(block)}}
function openEvent(id=null,date=''){editingEvent=id;const e=data.events.find(x=>x.id===id);$('eventModalTitle').textContent=e?'Edit event':'Add event';$('deleteEventBtn').style.visibility=e?'visible':'hidden';$('fTitle').value=e?.title||'';$('fDate').value=e?.date||date||iso(new Date());$('fStart').value=e?.start||'';$('fEnd').value=e?.end||'';$('fPlace').value=e?.place||'';$('fCategory').value=e?.category||'meeting';$('fCreateNote').checked=Boolean(e?.noteId);toggleMeeting();$('eventModal').classList.add('show')}
function toggleMeeting(){$('meetingNoteOption').classList.toggle('show',$('fCategory').value==='meeting')}
$('fCategory').onchange=toggleMeeting;$('addEventBtn').onclick=()=>openEvent();$('prevBtn').onclick=()=>{viewStart=addDays(viewStart,-7);renderCalendar()};$('nextBtn').onclick=()=>{viewStart=addDays(viewStart,7);renderCalendar()};$('todayBtn').onclick=()=>{viewStart=startOfWeek(new Date());renderCalendar()};
$('saveEventBtn').onclick=()=>{const title=$('fTitle').value.trim(),date=$('fDate').value;if(!title||!date)return alert('Please enter title and date.');const prior=data.events.find(x=>x.id===editingEvent),obj={id:editingEvent||uid(),title,date,start:$('fStart').value,end:$('fEnd').value,place:$('fPlace').value.trim(),category:$('fCategory').value,noteId:prior?.noteId||null};if(obj.category==='meeting'&&$('fCreateNote').checked&&!obj.noteId){const note={id:uid(),title:`Meeting: ${title}`,date,eventId:obj.id,content:'Participants:\n\nDiscussion:\n\nDecisions:\n\nNext actions:\n'};data.notes.unshift(note);obj.noteId=note.id;activeNote=note.id}if(editingEvent)data.events[data.events.findIndex(x=>x.id===editingEvent)]=obj;else data.events.push(obj);close('eventModal');persist();if(obj.noteId&&$('fCreateNote').checked){switchPage('notes');activeNote=obj.noteId;renderNotes()}};
$('deleteEventBtn').onclick=()=>{if(editingEvent&&confirm('Delete this event?')){data.events=data.events.filter(e=>e.id!==editingEvent);close('eventModal');persist()}};
function renderTodos(){const date=$('todoDate').value||iso(new Date()),list=$('todoList');list.innerHTML='';const items=data.todos.filter(t=>t.date===date);if(!items.length){list.innerHTML='<div class="empty">No tasks for this date.</div>';return}items.forEach(t=>{const row=document.createElement('div');row.className='todo-row'+(t.done?' done':'');row.innerHTML=`<input type="checkbox" ${t.done?'checked':''}><div><div class="todo-text">${esc(t.text)}</div><small>${esc(t.priority)} priority</small></div><button class="icon-btn">Delete</button>`;row.querySelector('input').onchange=e=>{t.done=e.target.checked;persist()};row.querySelector('button').onclick=()=>{data.todos=data.todos.filter(x=>x.id!==t.id);persist()};list.appendChild(row)})}
$('todoDate').value=iso(new Date());$('todoDate').onchange=renderTodos;$('addTodoBtn').onclick=()=>{$('fTodo').value='';$('fTodoDate').value=$('todoDate').value;$('todoModal').classList.add('show')};$('saveTodoBtn').onclick=()=>{const text=$('fTodo').value.trim();if(!text)return alert('Please enter a task.');data.todos.push({id:uid(),text,date:$('fTodoDate').value,priority:$('fPriority').value,done:false});close('todoModal');persist()};
function newNote(){const n={id:uid(),title:'New research note',date:iso(new Date()),content:''};data.notes.unshift(n);activeNote=n.id;persist();switchPage('notes')}
function renderNotes(){const list=$('noteList'),editor=$('noteEditor');list.innerHTML='';if(!data.notes.length)list.innerHTML='<div class="empty">No notes yet.</div>';data.notes.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(n=>{const card=document.createElement('div');card.className='note-card'+(n.id===activeNote?' active':'');card.innerHTML=`<strong>${esc(n.title)}</strong><small>${esc(n.date)}${n.eventId?' · Meeting note':''}</small>`;card.onclick=()=>{activeNote=n.id;renderNotes()};list.appendChild(card)});const n=data.notes.find(x=>x.id===activeNote);if(!n){editor.innerHTML='<div class="empty">Select a note or create a new one.</div>';return}editor.innerHTML=`<div class="note-meta"><div><label>Title</label><input id="nTitle" value="${esc(n.title)}"></div><div><label>Date</label><input id="nDate" type="date" value="${esc(n.date)}"></div></div><label>Research / meeting note</label><textarea id="nContent" placeholder="Write discussion, decisions, results, and next actions...">${esc(n.content)}</textarea><div class="modal-actions"><button class="btn danger" id="deleteNoteBtn">Delete note</button><button class="btn primary" id="saveNoteBtn">Save note</button></div>`;$('saveNoteBtn').onclick=()=>{n.title=$('nTitle').value.trim()||'Untitled note';n.date=$('nDate').value;n.content=$('nContent').value;persist()};$('deleteNoteBtn').onclick=()=>{if(confirm('Delete this note?')){data.notes=data.notes.filter(x=>x.id!==n.id);data.events.forEach(e=>{if(e.noteId===n.id)e.noteId=null});activeNote=null;persist()}}}
$('newNoteBtn').onclick=newNote;function close(id){$(id).classList.remove('show')}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.modal-backdrop').forEach(m=>m.onclick=e=>{if(e.target===m)close(m.id)});
function renderAll(){renderCalendar();renderTodos();renderNotes()}
async function startFirebase(){try{const [a,f,u]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js'),import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js')]);F={...a,...f,...u};const app=F.initializeApp(firebaseConfig);db=F.getFirestore(app);auth=F.getAuth(app);F.onAuthStateChanged(auth,user=>{if(user){$('loginBtn').textContent='Sign out';$('loginBtn').onclick=()=>F.signOut(auth);startSync()}else{$('loginBtn').textContent='Google sign-in';$('loginBtn').onclick=login;if(unsub)unsub();$('dot').classList.remove('on');$('syncText').textContent='Local'}})}catch(e){console.error(e);$('syncText').textContent='Firebase error'}}
async function login(){try{await F.signInWithPopup(auth,new F.GoogleAuthProvider())}catch(e){alert(e.message)}}$('loginBtn').onclick=login;
function startSync(){if(unsub)unsub();const ref=F.doc(db,'schedules','praja-simple-calendar');unsub=F.onSnapshot(ref,async snap=>{if(snap.exists()){const cloud=snap.data();data={events:Array.isArray(cloud.events)?cloud.events:data.events,todos:Array.isArray(cloud.todos)?cloud.todos:[],notes:Array.isArray(cloud.notes)?cloud.notes:[]};localStorage.setItem(key,JSON.stringify(data));renderAll()}else await F.setDoc(ref,{...data,updatedAt:F.serverTimestamp()});$('dot').classList.add('on');$('syncText').textContent='Live sync'},e=>{console.error(e);$('syncText').textContent='Sync blocked'})}
async function pushCloud(){if(!db||!auth?.currentUser||!F||syncing)return;syncing=true;try{await F.setDoc(F.doc(db,'schedules','praja-simple-calendar'),{...data,updatedAt:F.serverTimestamp()})}finally{syncing=false}}
renderAll();startFirebase();
</script>
</body>
</html>
